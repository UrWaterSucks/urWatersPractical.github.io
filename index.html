<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Title</title>
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <div id="wrapper">
      <div id="container">
        <h1>Splash Zone Tickets</h1>
        <p>Enter your name and age to see your ticket price.</p>
        <div id="nameEntry">
          <p>Name:</p>
          <input type="text" name="Name" id="name" />
        </div>
        <div id="ageEntry">
          <p>Age:</p>
          <input type="text" name="age" id="age" />
        </div>
        <button id="submit">Get My Ticket</button>
        <div id="ticketResult"></div>
      </div>
    </div>

    <script src="js/app.js"></script>
  </body>
</html>
